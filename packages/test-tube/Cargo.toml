[package]
description = "library for building integration testing environments for cosmos-sdk chains in Rust"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "test-tube"
repository = "https://github.com/osmosis-labs/test-tube"
version = "0.8.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22.1"
cosmrs = { workspace = true, features = ["cosmwasm", "rpc"]}
cosmwasm-std = { workspace = true, features = ["stargate", "cosmwasm_2_0", "cosmwasm_3_0"]}
dchain-sdk-proto = { workspace = true }
prost = "0.13.3"
serde = "1.0.144"
serde_json = "1.0.85"
thiserror = "1.0.34"

[dev-dependencies]
cw1-whitelist = "2.0.0"
rayon = "1.5.3"

[features]
cosmwasm_2_0 = ["cosmwasm-std/cosmwasm_2_0"]
default = []
module-wrappers = ["bank", "wasm"]
wasm-sudo = []

bank = []
wasm = []
