[package]
description = "CosmWasm integration testing for Dchain"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "dchain-test-tube"
repository = "https://github.com/d-foundation/protocol-test-tube"
version = "0.10.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

exclude = ["dchain", "test_artifacts"]

[dependencies]
base64 = "0.22.1"
cosmrs = { workspace = true, features = ["cosmwasm"]}
cosmwasm-std = { workspace = true }
dchain-sdk-proto = { workspace = true }
prost = "0.13.3"
serde = "1.0.144"
serde_json = "1.0.85"
test-tube = {version = "0.8.0", path = "../test-tube", features = [
  "module-wrappers",
]}
thiserror = "1.0.34"

[features]
default = []
wasm-sudo = ["test-tube/wasm-sudo"]

[build-dependencies]
bindgen = "0.70.1"

[dev-dependencies]
cw1-whitelist = "2.0.0"
rayon = "1.5.3"
simple-sudo = {path = "../../test_contracts/simple-sudo"}
